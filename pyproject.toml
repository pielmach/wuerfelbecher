[project]
name = "wuerfelbecher"
version = "1.6.0"
description = "A lightweight Discord bot for rolling dice in tabletop RPGs"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Michael Prim", email = "pielmach@outlook.de" },
]
dependencies = [
    "aiohttp>=3.14.5,<4",
    "discord-py>=2.7.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 127
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "C90",  # mccabe complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated.*:DeprecationWarning:discord.*",
]

[tool.coverage.run]
source = ["wuerfelbecher"]

[tool.coverage.report]
show_missing = true
